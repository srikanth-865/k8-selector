apiVersion: v1
kind: Pod
metadata:
  name: pod-1
  labels:
    project: roboshop
    tier: database
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-2
  labels:
    project: roboshop
    tier: backend
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: tier  #pod 1  Label-key
            operator: In
            values:
            - database #pod 1  Label-Value
        topologyKey: topology.kubernetes.io/zone # border is AZ (Ensures pods land on the exact same node)
  containers:
  - name: nginx
    image: nginx
    